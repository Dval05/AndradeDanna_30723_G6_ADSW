

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAAR - Dashboard (Simple)</title>
    <style>body{font-family:Arial,Helvetica,sans-serif;background:#0f172a;color:#e2e8f0;padding:24px}</style>
</head>
<body>
    <h2>Dashboard (Simple)</h2>
    <p>Total empleados: 6</p>
    <p>Total reportes: 2</p>
    <p>Accesos fallidos hoy: 2</p>
    <div>
        <canvas id="rolesChart" width="600" height="240"></canvas>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        var roleLabels = ["GUARDIA","SUPERVISOR","CENTRALISTA","JEFE_LOGISTICA"];
        var roleValues = [2,1,2,1];
        var ctx = document.getElementById('rolesChart').getContext('2d');
        new Chart(ctx, { type: 'pie', data: { labels: roleLabels, datasets: [{ data: roleValues }] } });
    </script>
</body>
</html>
